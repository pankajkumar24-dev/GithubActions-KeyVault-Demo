name: CI Pipeline

on:
  push:
    branches:
      - Dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js (explicitly use Node 24)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Azure login
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Example: Run your build/test
      - name: Run build
        run: |
          node -v
          npm install
          npm run build
